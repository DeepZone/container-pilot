name: Bug report
description: Report a reproducible Container Pilot defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Privacy: never include passwords, tokens, cookies, private image names, private registry URLs, internal hostnames or IP addresses, environment values, mount paths, full environment dumps, complete state files, or unredacted Docker inspection output. Security vulnerabilities must follow SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Container Pilot version
      placeholder: 0.9.0-rc.12
    validations:
      required: true
  - type: input
    id: docker_version
    attributes:
      label: Docker version
      placeholder: Docker Engine 27.5.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Host operating system
      placeholder: Debian 12
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: amd64 or arm64
    validations:
      required: true
  - type: input
    id: container_count
    attributes:
      label: Approximate container count
      placeholder: About 20
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include only the minimal relevant event or log lines after removing all sensitive data listed above.
