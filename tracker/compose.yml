services:
  tracker:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    env_file: .env
    environment:
      TRACKER_API_BIND: ${TRACKER_API_BIND:-0.0.0.0}
      TRACKER_DASHBOARD_BIND: ${TRACKER_DASHBOARD_BIND:-0.0.0.0}
      PGHOST: postgres
      PGDATABASE: container_pilot
      PGUSER: tracker
      TRACKER_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TRACKER_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    ports:
      - "127.0.0.1:3090:3090"
      - "${TRACKER_DASHBOARD_HOST:-127.0.0.1}:3091:3091"
    secrets:
      - admin_password
      - postgres_password
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: container_pilot
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - tracker-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d container_pilot"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  tracker-postgres:
secrets:
  admin_password:
    file: ./secrets/admin_password
  postgres_password:
    file: ./secrets/postgres_password
