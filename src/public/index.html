<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Container Pilot</title><link rel="stylesheet" href="app.css"></head>
<body><section id="loginView" class="login"><form id="loginForm" class="panel"><div class="mark">CP</div><h1>Container Pilot</h1><p>Docker-Updates unter Kontrolle</p><label>Benutzername<input name="username" autocomplete="username" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Anmelden</button><p id="loginError" class="bad"></p></form></section>
<div id="app" hidden><header><div><h1>Container Pilot</h1><p>Docker-Updates unter Kontrolle</p></div><nav><span id="who"></span><button id="usersButton">Benutzer</button><button id="logout">Abmelden</button><button id="scan" class="primary">Jetzt prüfen</button></nav></header><main><section class="summary"><div><span id="total">–</span><small>Container</small></div><div><span id="running">–</span><small>Laufen</small></div><div><span id="updates">–</span><small>Updates</small></div><div><span id="latest">–</span><small>latest verfügbar</small></div><p id="last">Noch nicht geprüft</p></section><p id="notice"></p><section class="tableWrap"><table><thead><tr><th>Container</th><th>Image</th><th>Status</th><th>Update</th><th>Automatik</th><th>Aktionen</th></tr></thead><tbody id="containerRows"></tbody></table></section><section><h2>Ereignisse</h2><div id="events" class="events"></div></section></main></div>
<dialog id="confirm"><form method="dialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="dialogActions"><button value="cancel">Abbrechen</button><button id="confirmGo" value="ok" class="danger">Ausführen</button></div></form></dialog>
<dialog id="usersDialog"><div class="dialogHead"><h2>Benutzerverwaltung</h2><button data-close-users>Schließen</button></div><form id="newUser" class="userForm"><label>Benutzername<input name="username" required minlength="3"></label><label>Passwort<input name="password" type="password" required minlength="12"></label><label>Rolle<select name="role"><option value="viewer">Betrachter</option><option value="admin">Administrator</option></select></label><button class="primary">Anlegen</button></form><div id="userList"></div></dialog>
<script type="module" src="app.js"></script></body></html>
